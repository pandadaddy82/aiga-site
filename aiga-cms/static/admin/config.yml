backend:
  name: github
  repo: pandadaddy82/aiga-site
  branch: main

media_folder: aiga-cms/static/uploads
public_folder: /uploads

locale: ko

collections:
  - name: insights
    label: 인사이트
    label_singular: 글
    folder: aiga-cms/content/insights
    create: true
    slug: '{{fields.slug}}'
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: slug, label: '주소(영문 소문자·하이픈)', widget: string, hint: '예: ai-governance-2' }
      - { name: category, label: 분류, widget: string, default: 'AI 거버넌스' }
      - { name: date, label: 날짜, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - { name: summary, label: '한 줄 요약', widget: text }
      - { name: body, label: 본문, widget: markdown }
